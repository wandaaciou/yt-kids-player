<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星星任務站</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff4fa;color:#503c58;font-family:Arial,"Noto Sans TC",sans-serif;padding:3vh 4vw}header{display:flex;justify-content:space-between;align-items:center;background:#f9d5e8;border-radius:24px;padding:1vh 3vw}h1{font-size:clamp(24px,4vw,52px);margin:0}#balance{font-size:4vw;font-weight:bold}#status{font-size:2.3vw;margin:2vh 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}button{font:inherit;color:inherit;border:3px solid transparent;cursor:pointer;border-radius:22px;background:#d4edff;padding:12px}button:focus{outline:5px solid #80529b;outline-offset:3px} .tile{min-height:25vh;font-size:3vw;font-weight:bold}.tile:nth-child(odd){background:#ffd9eb}.tile.done{background:#e9f5ff;border-color:#92b5ce}.symbol{display:block;font-size:5vw}.sub{display:block;font-size:1.8vw;margin-top:8px}footer{display:flex;justify-content:space-between;align-items:center;margin-top:2vh}input{font:inherit;padding:10px;max-width:100%;border:1px solid #bca5bf;border-radius:8px}#settings{background:white;padding:20px;border-radius:20px;margin-top:20px}#settings label{display:block;margin:10px 0}#msg{font-size:1.8vw}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.tile{font-size:22px;min-height:130px}.symbol{font-size:40px}.sub,#status,#msg{font-size:16px}#balance{font-size:28px}}
</style></head><body><header><h1>⭐ 酸菜的星星任務站</h1><div id="balance"></div></header><div id="status"></div><main class="grid" id="grid"></main><footer><span id="msg" role="status"></span><button id="open">媽媽設定</button></footer><section id="settings" hidden><label>獎勵內容 <input id="reward"></label><label>兌換點數 <input id="goal" type="number" min="1" max="100"></label><button id="save">儲存</button> <button id="close">關閉</button><div id="undo"></div><h3>最近七天紀錄</h3><div id="history"></div><h3>兌換紀錄</h3><div id="redemptions"></div></section><script>
(function(){var tasks=[['book','拿聯絡簿','📒'],['bowl','拿餐碗','🥣'],['bottle','拿水壺','💧'],['bath','洗澡','🛁'],['teeth','刷牙','🪥']],key='star-club-v1',s={days:{},spent:0,goal:10,reward:'選一個喜歡的活動',history:[]},message='',last='',storageOK=true;function el(id){return document.getElementById(id)}try{var raw=localStorage.getItem(key);if(raw)s=JSON.parse(raw)}catch(e){storageOK=false}function date(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}function day(){return s.days[date()]||(s.days[date()]={})}function count(d){return tasks.filter(function(t){return d[t[0]]}).length}function points(){return Object.keys(s.days).reduce(function(n,k){return n+count(s.days[k])},0)-s.spent}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){storageOK=false}}function button(parent,title,fn){var b=document.createElement('button');b.textContent=title;b.onclick=fn;parent.appendChild(b);return b}function render(focus){last=date();var d=day(),p=points(),g=el('grid');g.innerHTML='';el('balance').textContent='⭐ '+p;el('status').textContent=last+'　今日完成 '+count(d)+' / 5';tasks.forEach(function(t,i){var b=button(g,'',function(){if(!day()[t[0]]){day()[t[0]]=true;message=count(day())===5?'太棒了！全部完成！':'又得到一顆星星！';save();render(i)}});b.className='tile'+(d[t[0]]?' done':'');b.setAttribute('aria-label',t[1]+(d[t[0]]?' 已完成':' 完成加一點'));var a=document.createElement('span');a.className='symbol';a.textContent=t[2];b.appendChild(a);b.appendChild(document.createTextNode(t[1]));var sub=document.createElement('span');sub.className='sub';sub.textContent=d[t[0]]?'✓ 已完成':'完成 +1 ⭐';b.appendChild(sub)});var r=button(g,'',function(){if(points()<s.goal){message='再集 '+(s.goal-points())+' 顆星星！';render(5);return}if(confirm('兌換「'+s.reward+'」？')){s.spent+=s.goal;s.history.push({date:date(),reward:s.reward,cost:s.goal});save();message='兌換成功！';render(5)}});r.className='tile';var a=document.createElement('span');a.className='symbol';a.textContent='🎁';r.appendChild(a);r.appendChild(document.createTextNode('兌換獎勵'));var sub=document.createElement('span');sub.className='sub';sub.textContent=p+' / '+s.goal+'　'+s.reward;r.appendChild(sub);el('msg').textContent=(storageOK?'':'此瀏覽器無法保存紀錄。 ')+(message||'每天進步一點點！');el('undo').innerHTML='';tasks.forEach(function(t){if(d[t[0]])button(el('undo'),'取消 '+t[1],function(){if(points()>0){delete day()[t[0]];save();render()}})});el('history').textContent=Object.keys(s.days).sort().reverse().slice(0,7).map(function(k){return k+'：'+count(s.days[k])+'/5'}).join('　');el('redemptions').textContent=s.history.slice(-7).map(function(h){return h.date+' '+h.reward+'（'+h.cost+'點）'}).join('　')||'尚未兌換';if(typeof focus==='number')g.children[focus].focus()}
el('open').onclick=function(){el('settings').hidden=false;el('reward').value=s.reward;el('goal').value=s.goal;el('reward').focus()};el('close').onclick=function(){el('settings').hidden=true;el('open').focus()};el('save').onclick=function(){s.reward=el('reward').value.trim()||'選一個喜歡的活動';s.goal=Math.max(1,Math.min(100,Math.floor(Number(el('goal').value)||10)));save();render();el('settings').hidden=true;el('open').focus()};document.addEventListener('keydown',function(e){if(!el('settings').hidden)return;var buttons=Array.prototype.slice.call(el('grid').children).concat([el('open')]),i=buttons.indexOf(document.activeElement),k=e.keyCode;if([37,38,39,40].indexOf(k)<0)return;e.preventDefault();var cols=window.innerWidth<=600?2:3;var next=i<0?0:k===37?i-1:k===39?i+1:k===38?i-cols:i+cols;buttons[Math.max(0,Math.min(6,next))].focus()});render();el('grid').children[0].focus();setInterval(function(){if(date()!==last){message='';render()}},15000)})();
</script></body></html>
